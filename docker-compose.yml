services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports: [ "2181:2181" ]
  kafka:
    image: bitnami/kafka:3.7
    depends_on: [ zookeeper ]
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
    ports: [ "29092:29092" ]

  redis:
    image: redis:7
    ports: [ "6379:6379" ]

  keycloak-db:
    image: postgres:16
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - keycloak_db:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.4
    depends_on: [ keycloak-db ]
    command: >
      start-dev --import-realm
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak/realm-export:/opt/keycloak/data/import
    ports: [ "8085:8080" ]

  store-db:
    image: postgres:16
    environment:
      - POSTGRES_DB=storedb
      - POSTGRES_USER=store
      - POSTGRES_PASSWORD=store
    ports: [ "5433:5432" ]
    volumes: [ "store_db:/var/lib/postgresql/data" ]

  customer-db:
    image: postgres:16
    environment:
      - POSTGRES_DB=customerdb
      - POSTGRES_USER=customer
      - POSTGRES_PASSWORD=customer
    ports: [ "5434:5432" ]
    volumes: [ "customer_db:/var/lib/postgresql/data" ]

  order-db:
    image: postgres:16
    environment:
      - POSTGRES_DB=orderdb
      - POSTGRES_USER=orders
      - POSTGRES_PASSWORD=orders
    ports: [ "5435:5432" ]
    volumes: [ "order_db:/var/lib/postgresql/data" ]

  api-gateway:
    build: ./api-gateway
    depends_on: [ keycloak, redis ]
    environment:
      - SERVER_PORT=8080
      - SECURITY_DISABLED=false
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - OAUTH_ISSUER_URI=http://keycloak:8080/realms/shop
      - OAUTH_JWK_SET_URI=http://keycloak:8080/realms/shop/protocol/openid-connect/certs
    ports: [ "8080:8080" ]

  store-service:
    build: ./store-service
    depends_on: [ store-db, kafka, redis, keycloak ]
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://store-db:5432/storedb
      - SPRING_DATASOURCE_USERNAME=store
      - SPRING_DATASOURCE_PASSWORD=store
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SECURITY_DISABLED=false
      - OAUTH_ISSUER_URI=http://keycloak:8080/realms/shop
      - OAUTH_JWK_SET_URI=http://keycloak:8080/realms/shop/protocol/openid-connect/certs
      - SERVER_PORT=8081
    ports: [ "8081:8081" ]

  customer-service:
    build: ./customer-service
    depends_on: [ customer-db, keycloak ]
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://customer-db:5432/customerdb
      - SPRING_DATASOURCE_USERNAME=customer
      - SPRING_DATASOURCE_PASSWORD=customer
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SECURITY_DISABLED=false
      - OAUTH_ISSUER_URI=http://keycloak:8080/realms/shop
      - OAUTH_JWK_SET_URI=http://keycloak:8080/realms/shop/protocol/openid-connect/certs
      - SERVER_PORT=8082
    ports: [ "8082:8082" ]

  order-service:
    build: ./order-service
    depends_on: [ order-db, kafka, keycloak ]
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/orderdb
      - SPRING_DATASOURCE_USERNAME=orders
      - SPRING_DATASOURCE_PASSWORD=orders
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - STORE_SERVICE_URL=http://store-service:8081
      - SECURITY_DISABLED=false
      - OAUTH_ISSUER_URI=http://keycloak:8080/realms/shop
      - OAUTH_JWK_SET_URI=http://keycloak:8080/realms/shop/protocol/openid-connect/certs
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVER_PORT=8083
      - SEED_ORDER=true
    ports: [ "8083:8083" ]

  web-app:
    build: ./web-app
    environment:
      - VITE_API_BASE=http://localhost:8080
      - VITE_KEYCLOAK_URL=http://localhost:8085
      - VITE_KEYCLOAK_REALM=shop
      - VITE_KEYCLOAK_CLIENT=frontend
    ports: [ "5173:5173" ]

volumes:
  keycloak_db:
  store_db:
  customer_db:
  order_db:


